[env:esp32]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; COM port can vary (COM3, COM4, COM5) — check Device Manager if upload fails
upload_port = COM6
monitor_port = COM6
upload_protocol = esptool
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
build_flags = -DARDUINO_USB_CDC_ON_BOOT=0
lib_deps =
    ; Async web server + its TCP backend, both from the ESP32Async org so the
    ; server's own dependency resolves to the same AsyncTCP pinned here (no
    ; duplicate "Async TCP" fork). Pinned exact for reproducible builds.
    ESP32Async/ESPAsyncWebServer@3.11.1
    ESP32Async/AsyncTCP@3.4.10
    adafruit/Adafruit NeoPixel@^1.12.3
    bblanchon/ArduinoJson@^7.0.0
